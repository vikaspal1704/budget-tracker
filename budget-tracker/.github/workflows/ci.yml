name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install Dependencies
      run: pip install -r fastapi_hello/requirements.txt

    - name: Lint
      run: flake8 fastapi_hello/

    - name: Test
      run: pytest fastapi_hello/

    - name: Deploy to Railway
      run: echo "Deploy script placeholder"
